<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Contagem</title>

    <!-- links bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">


    <!-- Icones booststrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!--Meu CSS-->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Cabeçalho Menu/ Home-->
    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
        </div>

        <nav>

            <ul class="d-flex list-unstyled">

                <li><a href="#">Início</a></li>
                <li><a href="#">Eventos</a></li>
                <li><a href="#">Comércio</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Notícias</a></li>
                <li><a href="#">Oportunidades</a></li>
                <li><a href="#">Turismo</a></li>
                <li><a href="#">Mais</a></li>

            </ul>

        </nav>

        <div class="menu-direita">

            <a href="#">A-</a>
            <a href="#">A</a>
            <a href="#">A+</a>

            <button>Entrar</button>

        </div>
        

    </header>

    <!-- Banner azul abaixo do Cabeçalho Menu/Home-->

    <section class="hero-comercio">
        <div class="hero-container">
            
            <!-- Lado Esquerdo: Textos e Caminho (Breadcrumb) -->
            <div class="hero-conteudo">
                <h1 class="hero-titulo">Comércio Local</h1>
                <p class="hero-subtitulo">Descubra e apoie os pequenos negócios de Contagem.</p>
                
                <nav class="hero-breadcrumb">
                    <a href="#">Início</a> &gt; 
                    <a href="#">Comércio</a> &gt; 
                    <span>Comércio Local</span>
                </nav>
            </div>

            <!-- Lado Direito: Barra de Busca e Botões -->
            <div class="hero-acoes">
                <div class="busca-container">
                    <input type="text" class="busca-input" placeholder="Buscar negócios, produtos ou serviços...">
                    <button class="busca-btn" aria-label="Buscar">
                        <i class="bi bi-search"></i> <!-- Ícone do Bootstrap -->
                    </button>
                </div>
                
                <div class="botoes-container">
                    <button class="btn-mapa">
                        <i class="bi bi-geo-alt"></i> <!-- Ícone do Bootstrap -->
                        Ver no mapa
                    </button>
                    <button class="btn-comerciante">
                        <i class="bi bi-person-gear"></i> <!-- Ícone do Bootstrap -->
                        Sou comerciante
                    </button>
                </div>
            </div>

        </div>
    </section>

</body>

</html>
